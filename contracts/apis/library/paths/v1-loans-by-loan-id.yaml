parameters:
  - $ref: ../components/parameters/LoanId.yaml
get:
  operationId: getLoan
  summary: Get a loan
  description: Returns a single loan, including its current status.
  tags: [loans]
  x-stability-level: stable
  responses:
    '200':
      description: The loan.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Loan.yaml
          example:
            id: 0b9d8c7e-6f5a-4b3c-8d2e-1a0f9e8d7c6b
            bookId: 7c1e4b52-3f0a-4d8e-9b6a-1f2e3d4c5b6a
            status: overdue
            startedAt: '2026-01-10T12:00:00Z'
            dueAt: '2026-01-24T12:00:00Z'
    '400':
      $ref: ../../../shared/components/responses/BadRequest.yaml
    '404':
      $ref: ../../../shared/components/responses/NotFound.yaml
