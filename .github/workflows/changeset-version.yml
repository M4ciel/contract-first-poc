# On every push to main, opens or updates the "Version packages" pull request: version bumps and
# changelogs from the pending changesets. Merging it does not publish; release.yml does, by hand.
name: Changeset version

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changeset-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Open or update the Version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm release:version
          commit: 'chore(release): version packages'
          title: 'chore(release): Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
