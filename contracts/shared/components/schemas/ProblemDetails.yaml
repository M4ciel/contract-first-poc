type: object
description: |
  Error payload following RFC 9457 (Problem Details for HTTP APIs). `type` comes from the shared
  problem type catalog. Extension members are allowed, so consumers must ignore fields they do
  not know.
required: [type, title, status]
properties:
  type:
    $ref: ./ProblemType.yaml
  title:
    type: string
    description: Short, human-readable summary of the problem type.
  status:
    type: integer
    format: int32
    minimum: 100
    maximum: 599
    description: HTTP status code generated by the origin server.
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence.
  instance:
    type: string
    format: uri-reference
    description: URI reference that identifies this specific occurrence.
  errors:
    type: array
    description: Field-level validation errors. Present only on `urn:acme:problem:validation`.
    items:
      $ref: ./InvalidParam.yaml
additionalProperties: true
