type: object
description: |
  Error payload following RFC 9457 (Problem Details for HTTP APIs). Extension members are allowed,
  so consumers must ignore fields they do not know.
required: [type, title, status]
properties:
  type:
    type: string
    format: uri-reference
    description: URI reference that identifies the problem type.
    default: about:blank
  title:
    type: string
    description: Short, human-readable summary of the problem type.
  status:
    type: integer
    format: int32
    minimum: 100
    maximum: 599
    description: HTTP status code generated by the origin server.
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence.
  instance:
    type: string
    format: uri-reference
    description: URI reference that identifies this specific occurrence.
additionalProperties: true
