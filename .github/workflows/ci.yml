# Every pull request and every push to main. Nothing here publishes anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # The exact base commit: comparing with the current main gives wrong answers when main moves.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  checks:
    name: Lint, test, contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The compatibility and changeset checks read the base commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Workflows (actionlint)
        run: pnpm nx run @acme/tools:actionlint
      - name: Terraform format
        run: pnpm nx run @acme/infra:fmt-check
      - name: Contract lint
        run: pnpm nx run contracts:contract-lint
      - name: Software catalog (every API, event and app described, references valid)
        run: pnpm nx run @acme/tools:catalog-check

      - name: Generate, lint, typecheck, build
        run: pnpm nx run-many -t lint typecheck build
      - name: Tests and global coverage (≥ 80%)
        run: pnpm nx run @acme/tools:coverage
      - name: Mutation testing (@acme/domain, 100%)
        run: pnpm nx run @acme/domain:mutation

      - name: Contract compatibility (oasdiff against the base commit)
        run: pnpm nx run contracts:compat
        env:
          OASDIFF_FORMAT: githubactions
      - name: Changesets for affected packages
        # The Version PR consumes changesets on purpose.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm nx run @acme/tools:changeset-check

  e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @acme/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm nx run @acme/web:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: reports/e2e/
          retention-days: 7

  environment:
    name: Local environment (MiniStack, Flagsmith, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Start the environment
        run: pnpm nx run @acme/infra:up
      - name: Smoke test
        run: pnpm nx run @acme/infra:smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the environment
        if: always()
        run: docker compose down --volumes
