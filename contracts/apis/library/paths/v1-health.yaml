get:
  operationId: getHealth
  summary: Check service health
  description: Returns `ok` when the service and its dependencies are available.
  tags: [health]
  x-stability-level: stable
  responses:
    '200':
      description: The service is healthy.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Health.yaml
          example:
            status: ok
    '503':
      $ref: ../../../shared/components/responses/ServiceUnavailable.yaml
