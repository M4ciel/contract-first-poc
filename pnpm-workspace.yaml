packages:
  - 'contracts/packages/*'
  - 'apps/*'
  - 'tools'

# Exact versions only: `pnpm add` must never write ^ or ~ ranges.
savePrefix: ''
# Refuse to install with a Node.js/pnpm version different from `engines`.
engineStrict: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  nx: true
minimumReleaseAgeExclude:
  - msw@3.0.4
