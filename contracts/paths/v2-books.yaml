get:
  operationId: listBooksV2
  summary: List books (v2 preview)
  description: |
    Lists catalog books with the v2 shape (`authors` instead of `author`). This operation is in
    `alpha`: it may change without notice and is disabled in production by a feature flag.
  tags: [books]
  x-stability-level: alpha
  parameters:
    - $ref: ../components/parameters/Cursor.yaml
    - $ref: ../components/parameters/Limit.yaml
  responses:
    '200':
      description: A page of books.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BookV2Page.yaml
          example:
            items:
              - id: 7c1e4b52-3f0a-4d8e-9b6a-1f2e3d4c5b6a
                title: Book title 1
                authors: [Author name 1, Author name 2]
                publishedAt: '2020-01-15T00:00:00Z'
                createdAt: '2026-01-10T12:00:00Z'
            nextCursor: null
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
