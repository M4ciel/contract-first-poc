apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: library-web
  title: Library web app
  description: React app that uses the Library API only through the generated packages; runs on mocks without a backend.
spec:
  type: website
  lifecycle: production
  owner: team-frontend
  system: library
  consumesApis: [library-api]
  dependsOn:
    - component:acme-api-client
    - component:acme-api-types
    - component:acme-domain
